<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank Up and Mini Benefits</title>
    <link rel="icon" href="pennypts.ico" type="image/x-icon">
    <style>
        /* Define the color scheme */
        :root {
            --cyber-blue: #000428;
            --neon-blue: #00f7ff;
            --dark-blue: #004e92;
            --light-blue: #2196f3;
            --stake-white: #ffffff;
            --glow-blue: rgba(0, 247, 255, 0.5);
        }

        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--cyber-blue), var(--dark-blue));
            color: var(--stake-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Header Styling */
        h1 {
            margin-top: 120px;
            font-size: 2.5em;
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 15px;
            overflow: hidden;
        }

        table, th, td {
            border: 1px solid var(--neon-blue);
        }

        th, td {
            padding: 12px 20px;
            text-align: center;
            color: var(--stake-white);
            font-size: 1.1em;
        }

        th {
            background-color: var(--dark-blue);
        }

        td {
            background-color: rgba(0, 0, 0, 0.3);
        }

        /* Scrollable Table */
        .table-container {
            width: 80%;
            max-width: 1000px;
            margin-top: 40px;
            overflow-y: auto;
            max-height: 700px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.2);
            padding: 10px;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .info-message {
            display: none;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 5px;
            font-size: 0.9em;
            border-radius: 10px;
            max-width: 400px;
            text-align: center;
            margin-top: 20px;
            position: absolute;
            top: 150px;
            left: 39%;
            z-index: 9999;
        }

        .info-icon {
            cursor: pointer;
            font-weight: bold;
            color: var(--neon-blue);
            font-size: 1.3em;
            margin-left: 8px;
            border: none;
            background-color: transparent;
            padding: 5px 10px;
        }

        .cyber-navbar {
            background: rgba(0, 4, 40, 0.8);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: fixed;
            top: 1rem;
            left: 15%;
            right: 15%;
            z-index: 1000;
            border-bottom: 1px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 247, 255, 0.2);
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
        }

        .nav-link {
            color: var(--stake-white);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.3rem;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            color: var(--neon-blue);
        }

        .nav-logo {
            height: 45px;
            filter: drop-shadow(0 0 10px var(--glow-blue));
        }

        /* Social Links */
        .social-links {
            position: fixed;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 1rem;
            z-index: 1000;
        }

        .social-link {
            width: 60px;
            height: 60px;
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            transform: scale(1.1);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 12px;
            background-color: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--neon-blue);
            border-radius: 10px;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                margin-top: 100px;
            }

            .cyber-navbar {
                flex-direction: column;
                padding: 0.5rem;
                top: 0;
                left: 0;
                right: 0;
                margin: 0;
            }

            .nav-links {
                flex-direction: column;
                gap: 1rem;
            }

            .nav-link {
                font-size: 1rem;
            }

            .table-container {
                width: 95%;
                max-height: 400px;
            }

            .info-message {
                left: 10%;
                top: 120px;
                max-width: 90%;
            }

            .social-links {
                right: 0;
                bottom: 20px;
                top: auto;
                flex-direction: row;
                width: 100%;
                gap: 0.5rem;
                justify-content: space-around;
            }

            .social-link {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="cyber-navbar">
        <div class="nav-container">
            <img src="stake.webp" alt="Stake" class="nav-logo">
            <div class="nav-links">
                <a href="../home.html" class="nav-link">Home</a>
                <a href="../leaderboard/index.html" class="nav-link">Leaderboard</a>
                <a href="../StreamRewards/index.html" class="nav-link">Stream Rewards</a>
            </div>
        </div>
    </nav>

    <h1>Rank Up and Mini Benefits</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>RANK</th>
                    <th>WAGER</th>
                    <th>Reward</th>
                    <th>TOTAL</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Mini Benefit</td><td>$5,000</td><td>$2.5</td><td>$2.5</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function toggleInfoMessage() {
            var message = document.querySelector('.info-message');
            message.style.display = message.style.display === 'block' ? 'none' : 'block';
        }
    </script>
</body>
</html>
